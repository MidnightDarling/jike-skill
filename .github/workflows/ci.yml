name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex-*"
      - "claude/*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,qr]"
      - name: Static checks
        run: |
          python -m ruff check src scripts tests
          python - <<'PY'
          import py_compile
          import subprocess
          files = subprocess.check_output(
              ["git", "ls-files", "src/*.py", "scripts/*.py"],
              text=True,
          ).splitlines()
          for file in files:
              py_compile.compile(file, doraise=True)
          PY
      - name: Security checks
        run: |
          bandit -q $(git ls-files 'src/*.py' 'scripts/*.py')
          pip-audit --skip-editable
      - name: Tests
        run: python -m pytest
      - name: Wheel build and content check
        run: |
          python -m pip wheel . --no-deps -w /tmp/jike-wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = max(Path("/tmp/jike-wheel").glob("jike_skill-*.whl"))
          required = {
              "jike/client_cli.py",
              "jike/export.py",
              "jike/export_utils.py",
              "jike_skill/scripts/auth.py",
              "jike_skill/scripts/client.py",
              "jike_skill/scripts/export.py",
              "jike_skill/references/api.md",
              "jike_skill/skills/jike/SKILL.md",
              "jike_skill/SECURITY.md",
              "jike_skill/assets/app-icon.svg",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          forbidden = sorted(
              name
              for name in names
              if name.split("/")[-1].startswith("._") or "__pycache__" in name or name.endswith(".pyc")
          )
          if missing or forbidden:
              raise SystemExit(f"wheel missing files: {missing}; forbidden files: {forbidden}")
          PY
