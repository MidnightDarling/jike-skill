      <rect x="214" y="224" width="44" height="44" rx="9"/>
      <rect x="268" y="224" width="18" height="18" rx="4"/>
      <rect x="292" y="248" width="18" height="44" rx="5"/>
      <rect x="240" y="276" width="46" height="18" rx="5"/>
      <rect x="214" y="276" width="18" height="18" rx="4"/>
    </g>

    <g fill="#FFF4BD">
      <rect x="226" y="158" width="18" height="18" rx="4"/>
      <rect x="226" y="236" width="20" height="20" rx="4"/>
      <rect x="266" y="172" width="18" height="18" rx="4"/>
      <rect x="266" y="250" width="18" height="18" rx="4"/>
      <rect x="292" y="224" width="18" height="18" rx="4"/>
    </g>

    <g stroke="#FFF2A8" stroke-linecap="round" stroke-width="7" opacity="0.86">
      <path d="M150 98 L122 70"/>
      <path d="M362 98 L390 70"/>
      <path d="M256 72 L256 40"/>
      <path d="M118 210 L82 202"/>
      <path d="M394 210 L430 202"/>
