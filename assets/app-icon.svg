    <path d="M118 430 C170 458 248 470 318 448 C372 431 407 398 428 360" fill="none" stroke="#F6C945" stroke-width="8" stroke-linecap="round" opacity="0.72"/>
    <path d="M132 429 C190 442 266 438 319 415" fill="none" stroke="#FFF0A1" stroke-width="3" stroke-linecap="round" opacity="0.64"/>
  </g>
</svg>
