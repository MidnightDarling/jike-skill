[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jike-skill"
version = "0.4.2"
description = "Jike (即刻) client for humans and AI agents — QR login (HTML or ASCII), feed, posts, comments, search, export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alice and contributors" }]
keywords = ["jike", "即刻", "social", "ai-agent", "claude", "skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
qr = ["qrcode[pil]>=7.4,<9", "Pillow>=12.2,<13"]
dev = [
    "bandit[toml]>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
jike = "jike.__main__:main"
jike-auth = "jike.auth:main"
jike-api = "jike.client_cli:main"
jike-export = "jike.export:main"

[project.urls]
Homepage = "https://github.com/MidnightDarling/jike-skill"
Repository = "https://github.com/MidnightDarling/jike-skill"
Issues = "https://github.com/MidnightDarling/jike-skill/issues"
Documentation = "https://github.com/MidnightDarling/jike-skill/blob/main/README.md"
Changelog = "https://github.com/MidnightDarling/jike-skill/blob/main/CHANGELOG.md"
Security = "https://github.com/MidnightDarling/jike-skill/security/advisories/new"

[tool.hatch.build.targets.wheel]
packages = ["src/jike"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/auth.py" = "jike_skill/scripts/auth.py"
"scripts/client.py" = "jike_skill/scripts/client.py"
"scripts/export.py" = "jike_skill/scripts/export.py"
"references/api.md" = "jike_skill/references/api.md"
"SKILL.md" = "jike_skill/SKILL.md"
"SECURITY.md" = "jike_skill/SECURITY.md"
"skills/jike/SKILL.md" = "jike_skill/skills/jike/SKILL.md"
"assets/app-icon.svg" = "jike_skill/assets/app-icon.svg"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist"]
